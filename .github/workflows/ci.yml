name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reject non-standard registry URLs
        run: '! grep -q "registry.npmmirror.com" package-lock.json'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reject non-standard registry URLs
        run: '! grep -q "registry.npmmirror.com" package-lock.json'

      - run: npm ci

      # Fail on high/critical vulnerabilities with no accepted exception.
      # Accepted exceptions (transitive deps with no upstream fix) are listed
      # in scripts/audit-check.js and documented in docs/audit-exceptions.md.
      # To accept a new exception: add the advisory ID to ACCEPTED_ADVISORIES
      # in scripts/audit-check.js and document the reason in
      # docs/audit-exceptions.md with a review-by date (max 90 days out).
      - name: Audit dependencies (high/critical)
        run: node scripts/audit-check.js

  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reject non-standard registry URLs
        run: '! grep -q "registry.npmmirror.com" package-lock.json'

      - run: npm ci

      - name: Run tests
        run: npm test

      # Run coverage as a separate step so a threshold failure is clearly
      # labelled "coverage gate" rather than "tests failed".
      - name: Coverage gate
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reject non-standard registry URLs
        run: '! grep -q "registry.npmmirror.com" package-lock.json'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
          NEXT_PUBLIC_NETWORK_PASSPHRASE: ${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
          NEXT_PUBLIC_FACTORY_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_FACTORY_CONTRACT_ID }}
          NEXT_PUBLIC_GOVERNOR_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_GOVERNOR_CONTRACT_ID }}

  a11y:
    name: Accessibility checks
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reject non-standard registry URLs
        run: '! grep -q "registry.npmmirror.com" package-lock.json'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run a11y tests
        run: npm run test:e2e -- e2e/a11y.spec.ts
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
          NEXT_PUBLIC_NETWORK_PASSPHRASE: ${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
          NEXT_PUBLIC_FACTORY_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_FACTORY_CONTRACT_ID }}
          NEXT_PUBLIC_GOVERNOR_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_GOVERNOR_CONTRACT_ID }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
